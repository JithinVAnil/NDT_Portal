# NIELIT Digital Training Portal — PROTOTYPE (sample data)
# Start everything:   docker compose up --build
# Frontend http://localhost:3000 · API http://localhost:8000 · Swagger http://localhost:8000/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nielit_portal
      POSTGRES_USER: nielit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nielit_demo}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nielit -d nielit_portal"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://nielit:${POSTGRES_PASSWORD:-nielit_demo}@db:5432/nielit_portal
      JWT_SECRET: ${JWT_SECRET:-please-set-a-long-random-secret-in-dot-env}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo@12345}
      AUTO_SEED: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
  media:
